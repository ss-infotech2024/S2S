<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g_salesforce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <radialGradient id="g_salesforce_glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="g_salesforce_dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#g_salesforce)"/>
  <rect width="800" height="450" fill="url(#g_salesforce_dots)"/>
  <rect width="800" height="450" fill="url(#g_salesforce_glow)"/>

  <circle cx="740" cy="-40" r="220" fill="#ffffff" opacity="0.06"/>
  <circle cx="-60" cy="490" r="200" fill="#000000" opacity="0.12"/>

  <!-- icon badge -->
  <circle cx="650" cy="150" r="80" fill="#ffffff" fill-opacity="0.14"/>
  <circle cx="650" cy="150" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  
        <g transform="translate(650,150)" fill="none" stroke="#ffffff" stroke-width="13.299999999999999" stroke-linecap="round">
          <path d="M -57.0 0 A 30.4 30.4 0 1 1 -3.8 26.599999999999998"/>
          <path d="M 57.0 0 A 30.4 30.4 0 1 1 3.8 -26.599999999999998"/>
          <path d="M -19.0 15.2 L -3.8 26.599999999999998 L 11.399999999999999 7.6" fill="none"/>
          <path d="M 19.0 -15.2 L 3.8 -26.599999999999998 L -11.399999999999999 -7.6" fill="none"/>
        </g>

  <!-- category pill -->
  <rect x="28" y="30" width="50.5" height="34" rx="17" fill="#ffffff" fill-opacity="0.18"/>
  <text x="43" y="53" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">CRM</text>

  <!-- title -->
  <text x="30" y="402" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Salesforce</text>
  <rect x="30" y="420" width="70" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.85"/>
